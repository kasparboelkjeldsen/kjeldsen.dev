trigger:
  branches:
    include:
      - main
  paths:
    include:
      - kjeldsen.backend/**
      - kjeldsen.frontend/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: site
  - name: configuration
    value: 'Release'
  - name: backendProject
    value: 'kjeldsen.backend/kjeldsen.backend.csproj'
  - name: frontendDirectory
    value: 'kjeldsen.frontend'
  - name: azureSubscription
    value: 'kjeldsen.dev'
  - name: resourceGroup
    value: 'kjdev-rg'
  - name: webAppNameCm
    value: 'kjdev-app-backend'
  - name: webAppNameFrontend
    value: 'kjdev-app-frontend'

stages:
# -------------------------------
# Stage 0: Detect changes once
# -------------------------------
- stage: DetectChanges
  displayName: 'Detect Changed Areas'
  jobs:
    - job: Detect
      displayName: 'Detect Frontend/Backend Changes'
      steps:
        - checkout: self
          displayName: 'Checkout (fetchDepth=2 for diff)'
          fetchDepth: 2

        - pwsh: |
            Write-Host "Build.Reason: $(Build.Reason)"
            Write-Host "Build.SourceVersion: $(Build.SourceVersion)"

            # Manual runs: run everything
            if ("$(Build.Reason)" -eq "Manual") {
              Write-Host "Manual run detected -> setting both FrontendChanged and BackendChanged to true."
              Write-Host "##vso[task.setvariable variable=FrontendChanged;isOutput=true]true"
              Write-Host "##vso[task.setvariable variable=BackendChanged;isOutput=true]true"
              exit 0
            }

            # Ensure git exists and repo has at least two commits to diff
            $hasParent = $false
            try {
              $parent = git rev-parse "$(Build.SourceVersion)^" 2>$null
              if ($LASTEXITCODE -eq 0 -and $parent) { $hasParent = $true }
            } catch { $hasParent = $false }

            if (-not $hasParent) {
              Write-Warning "No parent commit found (first commit or shallow). Defaulting to both true."
              Write-Host "##vso[task.setvariable variable=FrontendChanged;isOutput=true]true"
              Write-Host "##vso[task.setvariable variable=BackendChanged;isOutput=true]true"
              exit 0
            }

            # Get changed files between HEAD^ and HEAD
            $files = git diff --name-only "$(Build.SourceVersion)^" "$(Build.SourceVersion)"
            Write-Host "Changed files:`n$files"

            $frontendMatch = $false
            $backendMatch  = $false

            if ($files) {
              foreach ($f in $files) {
                if ($f -like 'kjeldsen.frontend/*' -or $f -like 'kjeldsen.frontend/**') { $frontendMatch = $true }
                if ($f -like 'kjeldsen.backend/*'  -or $f -like 'kjeldsen.backend/**')  { $backendMatch  = $true }
              }
            }

            $frontendOut = if ($frontendMatch) { 'true' } else { 'false' }
            $backendOut  = if ($backendMatch)  { 'true' } else { 'false' }

            Write-Host "FrontendChanged=$frontendOut"
            Write-Host "BackendChanged=$backendOut"

            # Set output variables (cross-stage)
            Write-Host "##vso[task.setvariable variable=FrontendChanged;isOutput=true]$frontendOut"
            Write-Host "##vso[task.setvariable variable=BackendChanged;isOutput=true]$backendOut"
          displayName: 'Compute change flags'
          name: Changes

# ---------------------------------------
# Stage 1: Frontend (Nuxt) - run on need
# ---------------------------------------
- stage: BuildFrontend
  displayName: 'Build Frontend (Nuxt)'
  dependsOn: DetectChanges
  condition: |
    or(
      eq(dependencies.DetectChanges.outputs['Detect.Changes.FrontendChanged'], 'true'),
      eq(variables['Build.Reason'], 'Manual')
    )
  jobs:
    - job: BuildAndPublishFrontend
      displayName: 'Build and Publish Frontend'
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '22.x'
          displayName: 'Install Node.js'

        - task: PowerShell@2
          displayName: 'Install dependencies and build Nuxt'
          env:
            AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
            AZURE_TENANT_ID: $(AZURE_TENANT_ID)
            AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
          inputs:
            targetType: 'inline'
            script: |
              cd "$(frontendDirectory)"
              npm ci
              npm run build

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(frontendDirectory)/.output'
            artifactName: 'frontend'
          displayName: 'Publish frontend artifact'

        - task: ArchiveFiles@2
          displayName: 'Archive frontend output'
          inputs:
            rootFolderOrFile: '$(frontendDirectory)/.output'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-output.zip'
            replaceExistingArchive: true

        - task: AzureAppServiceSettings@1
          displayName: 'Set frontend app settings for package deploy'
          inputs:
            azureSubscription: '$(azureSubscription)'
            resourceGroupName: '$(resourceGroup)'
            appName: '$(webAppNameFrontend)'
            appSettings: |
              [
                {"name":"SCM_DO_BUILD_DURING_DEPLOYMENT","value":"false","slotSetting":false},
                {"name":"WEBSITE_RUN_FROM_PACKAGE","value":"1","slotSetting":false}
              ]

        - task: AzureWebApp@1
          displayName: 'Deploy Frontend to Azure App Service'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appName: '$(webAppNameFrontend)'
            package: '$(Build.ArtifactStagingDirectory)/frontend-output.zip'
            appType: 'webAppLinux'
            deploymentMethod: 'runFromPackage'

# ----------------------------------------
# Stage 2: Backend (Umbraco) - run on need
# ----------------------------------------
- stage: BuildBackend
  displayName: 'Build and Deploy Umbraco Backend'
  dependsOn:
    - DetectChanges
    - BuildFrontend
  condition: |
    or(
      eq(dependencies.DetectChanges.outputs['Detect.Changes.BackendChanged'], 'true'),
      eq(variables['Build.Reason'], 'Manual')
    )
  jobs:
    - job: BuildAndPublishBackend
      displayName: 'Build and Publish Umbraco Artifact'
      steps:
        - task: UseDotNet@2
          displayName: 'Use .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '10.x'
            includePreviewVersions: true

        - task: DotNetCoreCLI@2
          displayName: 'Publish Umbraco (Trimmed)'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '$(backendProject)'
            arguments: >
              --configuration $(configuration)
              --output $(Build.ArtifactStagingDirectory)/umbraco
              /p:SelfContained=false
              /p:RuntimeIdentifier=linux-x64
              /p:PublishReadyToRun=true
              /p:EnableCompressionInSingleFile=true
            zipAfterPublish: true

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Umbraco Artifact'
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)/umbraco'
            artifactName: 'umbraco'

    - job: DeployBackend
      displayName: 'Deploy Umbraco to Azure App Service'
      dependsOn: BuildAndPublishBackend
      steps:
        - download: current
          artifact: umbraco
          displayName: 'Download Umbraco Artifact'

        # A clean deploy on purpose: the plain zip deploy left assemblies from removed packages
        # behind in wwwroot, and Umbraco scans every DLL it finds there. This removes anything
        # that is not in the package.
        - task: AzureCLI@2
          displayName: 'Deploy Umbraco CM to Azure App Service (clean)'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e
              pkg=$(ls $(Pipeline.Workspace)/umbraco/*.zip | head -1)
              # Asynchronous, then polled: a synchronous deploy of this package takes longer
              # than Kudu's gateway allows and comes back as a 504 while the deploy itself
              # carries on and succeeds.
              az webapp deploy --resource-group "$(resourceGroup)" --name "$(webAppNameCm)" \
                --src-path "$pkg" --type zip --clean true --restart true --async true
              # The Kudu host is the default host with ".scm." after the app name.
              scm="https://$(az webapp show --resource-group "$(resourceGroup)" --name "$(webAppNameCm)" \
                --query "defaultHostName" -o tsv | sed 's/^\([^.]*\)\./\1.scm./')"
              for i in $(seq 1 60); do
                sleep 20
                state=$(az rest --method get --url "$scm/api/deployments/latest" \
                  --resource "https://management.azure.com/" --query "[status, complete]" -o tsv | tr '\n' ' ')
                echo "deployment: $state"
                case "$state" in
                  "4 True"*|"4 true"*) echo "deployed"; exit 0 ;;
                  "3 True"*|"3 true"*|"-1 True"*|"-1 true"*) echo "deployment failed"; exit 1 ;;
                esac
              done
              echo "timed out waiting for the deployment"; exit 1

# -------------------------------
# Stage 3: Warmup (after frontend)
# -------------------------------
# Crawls the site's pages and fetches every image variant they reference, so the first visitor
# after a deploy never waits for the CMS to encode a WebP (measured at eight seconds cold for a
# hero picture) or for Front Door to fill its edge cache. Pages come from the navigation and the
# blog listing; there is no route list any more.
- stage: Warmup
  displayName: 'Warm pages and images'
  dependsOn: BuildFrontend
  condition: succeeded()
  jobs:
    - job: Warm
      displayName: 'Fetch pages, then their images'
      steps:
        - checkout: none
        - bash: |
            set -u
            base="https://www.kjeldsen.dev"

            # The new package takes a little while to become the running site.
            sleep 90

            fetch() { curl -s --compressed -H 'Accept-Encoding: br, gzip' --max-time 120 "$1"; }

            pages="/ /blog/ /umbraco-packages/"
            for p in $pages; do
              pages="$pages $(fetch "$base$p" | grep -o 'href="/[a-z0-9/-]*/"' | sed 's/href="//; s/"$//' | sort -u | tr '\n' ' ')"
            done
            pages=$(echo "$pages" | tr ' ' '\n' | sort -u)

            for p in $pages; do
              html=$(fetch "$base$p")
              echo "page $p ($(echo -n "$html" | wc -c) bytes)"
              echo "$html" | grep -o '/api/media/[^" ]*' | sed 's/&amp;/\&/g' | sort -u | while read -r u; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$base$u")
                echo "  image $code $u"
              done
            done
          displayName: 'Warm www.kjeldsen.dev'
